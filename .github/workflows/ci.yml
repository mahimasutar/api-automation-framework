name: API Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Target Health Check
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://restful-booker.herokuapp.com/ping; then
              echo "Target API is UP"
              exit 0
            fi
            echo "Waiting for target API (attempt $i/5)..."
            sleep 10
          done
          echo "Target API unavailable"
          exit 1

      - name: Run Smoke Tests
        run: pytest -m smoke
        env:
          RB_USERNAME: ${{ secrets.RB_USERNAME }}
          RB_PASSWORD: ${{ secrets.RB_PASSWORD }}

      - name: Run Regression Tests (Parallel workers = 2)
        run: pytest -m regression -n 2
        env:
          RB_USERNAME: ${{ secrets.RB_USERNAME }}
          RB_PASSWORD: ${{ secrets.RB_PASSWORD }}

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14
