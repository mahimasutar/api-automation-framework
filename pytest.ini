[pytest]
addopts = -v --alluredir=allure-results --reruns 1 --reruns-delay 2
markers =
    smoke: fast critical checks
    regression: full suite
    auth: authentication tests
    crud: CRUD operations tests
    validation: input validation tests
    persistence: round-trip persistence tests
    filters: search and filter tests
    e2e: end-to-end multi-step flows
    schema: response schema validation tests
log_cli = true
log_cli_level = INFO
